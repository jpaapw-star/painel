<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Meus apps</title>
<link rel="icon" href="../favicon.png" />
<link rel="apple-touch-icon" href="../favicon.png" />
<meta name="apple-mobile-web-app-title" content="Meus apps" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
<style>
  :root {
    --fundo: #f5f5f7; --cartao: #ffffff; --borda: #e3e3e6; --texto: #1d1d1f; --suave: #6e6e73;
    --icone-fundo: #1d1d1f; --icone: #ffffff; --sombra: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #000000; --cartao: #1c1c1e; --borda: #2c2c2e; --texto: #f5f5f7; --suave: #8e8e93;
      --icone-fundo: #f5f5f7; --icone: #000000; --sombra: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto); }
  body {
    font: 400 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: max(32px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 8px 4px 24px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  a {
    display: flex; align-items: center; gap: 14px; height: 100%;
    padding: 16px; border-radius: 18px; text-decoration: none; color: inherit;
    background: var(--cartao); border: 1px solid var(--borda); box-shadow: var(--sombra);
    transition: transform .15s ease, border-color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  a:hover { border-color: var(--suave); }
  a:active { transform: scale(.97); }
  a:focus-visible { outline: 2px solid var(--texto); outline-offset: 2px; }
  .ic {
    flex: none; width: 52px; height: 52px; border-radius: 13px;
    display: grid; place-items: center; background: var(--icone-fundo); color: var(--icone);
  }
  .ic svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nome { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .desc { font-size: 14px; color: var(--suave); margin-top: 2px; }
  @media (max-width: 480px) {
    h1 { font-size: 30px; margin-bottom: 18px; }
    ul { grid-template-columns: 1fr; gap: 10px; }
  }
</style>
</head>
<body>
<main>
  <h1>Meus apps</h1>
  <!-- Para incluir um app: copie um <li> inteiro e troque o endereço, o nome e a frase. -->
  <ul>
    <li><a href="https://jpaapw-star.github.io/scan-app/" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 8v8M11 8v8M14 8v8M17 8v8"/></svg></span>
      <span><div class="nome">SCAN</div><div class="desc">Ler produtos por foto</div></span></a></li>

    <li><a href="https://jpaapw-star.github.io/painel/" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg></span>
      <span><div class="nome">Painel EMANX</div><div class="desc">Produção, metas e qualidade</div></span></a></li>

    <li><a href="https://script.google.com/macros/s/AKfycbzFCFxbdNCHE-TuF4ox7pM5LO_p_aKDsBDOesr__M0o-Hc9tPzyPRDapfEkNEUfMosVsQ/exec" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="8" cy="8" r="1.5"/></svg></span>
      <span><div class="nome">Preço Médio</div><div class="desc">Média de venda e custo</div></span></a></li>

    <li><a href="https://script.google.com/macros/s/AKfycbyJartOZ2D2KeLQ_IFelaF1pemHf1Xun0MlglVAE9UDTeQM8e847r32Yxfis3VL5BClsg/exec" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3.6 17.1a1.9 1.9 0 0 0 2.7 2.7l5.7-5.7a4 4 0 0 0 5.1-5.4l-2.5 2.5-2.4-.4-.4-2.4 2.9-2.1Z"/></svg></span>
      <span><div class="nome">Manutenção notebooks</div><div class="desc">Aparelhos em conserto</div></span></a></li>


    <li><a href="https://script.google.com/macros/s/AKfycbwru0lyaMAu-8ru7gR3rLNVyPlndD__Fg2ppdDY2bNNBWNTRuN-HywQAeWaWw4WUWlVvw/exec" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2V5Z"/><path d="M4 21a2 2 0 0 1 2-2h12v2H6M9 8h6M9 11h4"/></svg></span>
      <span><div class="nome">Manuais Clicou</div><div class="desc">Manuais com QR</div></span></a></li>

    <li><a href="https://script.google.com/macros/s/AKfycbyfOXgR0xm5gjeBmB14sxynENX6OyLQ9aZLOmLaWk03ZGx8FL-CtOFVnLDl2-TyDOIBXQ/exec" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
      <span><div class="nome">Fotos da equipe</div><div class="desc">Foto de cada pessoa na planilha</div></span></a></li>
  </ul>
</main>
</body>
</html>
